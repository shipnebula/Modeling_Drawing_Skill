[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "math-modeling-viz"
version = "1.0.0"
description = "Nature-level publication quality plots for mathematical modeling competitions (CUMCM/MCM/ICM)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Math Modeling Viz Contributors"}
]
keywords = [
    "mathematical-modeling", "visualization", "plotting", "cicum", "mcm",
    "icm", "publication-quality", "data-science", "competition"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "matplotlib>=3.7.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
extra = ["seaborn>=0.12.0", "networkx>=3.0", "scikit-learn>=1.3", "plotly>=5.15.0"]
dev = ["pytest>=7.0"]

[project.scripts]
mmv = "scripts.render:main"

[tool.setuptools.packages.find]
where = ["scripts"]
include = ["plot*"]